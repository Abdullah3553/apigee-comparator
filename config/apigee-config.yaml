# Apigee Instance Configuration
# This file defines the Apigee instances, organizations, and environments to monitor
#
# MOCK SERVICE MODE:
# When USE_MOCK_SERVICE=true in .env, ALL instances will be redirected to the mock server.
# This allows testing without real Apigee access while keeping your instance configurations.
#
# When USE_MOCK_SERVICE=false (default), each instance uses its configured management_url.

instances:
  # Production Instance (uncomment and configure when ready to use real Apigee)
  # - name: "PROD"
  #   management_url: "https://api.enterprise.apigee.com/v1"
  #   org: "your-prod-org-name"
  #   credentials:
  #     username: "${APIGEE_PROD_USERNAME}"
  #     password: "${APIGEE_PROD_PASSWORD}"
  #   environments:
  #     - "test"
  #     - "staging"
  #     - "production"

  # Development Instance (example - uncomment and configure if needed)
  # - name: "DEV"
  #   management_url: "https://api.enterprise.apigee.com/v1"
  #   org: "your-dev-org-name"
  #   credentials:
  #     username: "${APIGEE_DEV_USERNAME}"
  #     password: "${APIGEE_DEV_PASSWORD}"
  #   environments:
  #     - "dev"
  #     - "qa"

  # Mock Server Instance (active for local development)
  # Use this instance directly when USE_MOCK_SERVICE=false but you want to test with mock data
  # Or set USE_MOCK_SERVICE=true to redirect ALL instances to the mock server
  # Note: management_url uses localhost for non-Docker runs; Docker uses MOCK_SERVER_URL env var
  - name: "MOCK"
    management_url: "http://localhost:8080/v1"
    org: "mock-org"
    credentials:
      username: "${APIGEE_MOCK_USERNAME}"
      password: "${APIGEE_MOCK_PASSWORD}"
    environments:
      - "dev"
      - "staging"

# Notes:
# - Credentials use environment variable interpolation: ${VAR_NAME}
# - Environment variable pattern: APIGEE_{INSTANCE_NAME}_USERNAME/PASSWORD
# - Each environment will be uniquely identified as: INSTANCE-ORG-ENV
# - Example identifier: PROD-your-prod-org-name-production
#
# Mock Service Quick Reference:
# - To use mock data: Set USE_MOCK_SERVICE=true in .env and run: docker-compose --profile mock up
# - To use live data: Set USE_MOCK_SERVICE=false in .env (or remove it)
