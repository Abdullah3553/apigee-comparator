services:
  db:
    image: postgres:15-alpine
    container_name: apigee-monitor-db
    environment:
      POSTGRES_DB: ${DB_NAME:-apigee_monitor}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: apigee-monitor-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3001}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-apigee_monitor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CONFIG_PATH: /app/config/apigee-config.yaml
      # Mock service configuration
      USE_MOCK_SERVICE: ${USE_MOCK_SERVICE:-false}
      MOCK_SERVER_URL: http://mock-server:8080/v1
      MOCK_AUTH_USERNAME: ${MOCK_AUTH_USERNAME:-mock}
      MOCK_AUTH_PASSWORD: ${MOCK_AUTH_PASSWORD:-mock}
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/src:/app/src
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: apigee-monitor-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    command: npm run dev -- --host

  mock-server:
    profiles: ["mock"]
    build:
      context: ./mock-server
      dockerfile: Dockerfile
      target: development
    container_name: apigee-mock-server
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MOCK_SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_HOT_RELOAD: ${ENABLE_HOT_RELOAD:-true}
      MOCK_AUTH_USERNAME: ${MOCK_AUTH_USERNAME:-mock}
      MOCK_AUTH_PASSWORD: ${MOCK_AUTH_PASSWORD:-mock}
    ports:
      - "${MOCK_SERVER_PORT:-8080}:8080"
    volumes:
      - ./mock-server/src:/app/src
      - ./mock-server/data:/app/data:ro
      - ./mock-server/certs:/app/certs:ro
    command: npm run dev

volumes:
  postgres-data:
    driver: local
